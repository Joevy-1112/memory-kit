[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-kit"
version = "1.2.0"
description = "给 AI 用的轻量记忆系统：SQLite 可检索/可过期/可纠正记忆库 + 三路检索 + 遗忘状态机 + 语义闸门"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "memory-kit contributors" }]
keywords = ["memory", "sqlite", "fts5", "embedding", "knowledge", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jieba==0.42.1",
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://github.com/Joevy-1112/memory-kit"
Documentation = "https://github.com/Joevy-1112/memory-kit#readme"
Repository = "https://github.com/Joevy-1112/memory-kit"

[tool.setuptools]
packages = ["memorykit"]

[tool.setuptools.package-data]
memorykit = ["py.typed", "data/*.txt"]
